[package]
name = "armada-stack"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Self-host Armada: its web app, a relay, a Blossom server, and a Concord AV broker in one binary"
license = "AGPL-3.0-only"

[[bin]]
name = "armada"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
arc-swap = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
brotli = "8"
bytes = "1.9"
chacha20 = "0.9"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
heed = { version = "0.22", default-features = false, features = ["serde-json"] }
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
http = "1"
httpdate = "1"
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["server-auto", "server-graceful", "service", "tokio"] }
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }
libc = "0.2"
# The LMDB heed links, used directly by the relay for duplicate-sorted
# lookups heed doesn't expose. Kept at heed's version so there's one LMDB.
lmdb-master-sys = "0.2.6"
lru = "0.12"
memmap2 = "0.9"
p256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
parking_lot = "0.12"
rand = "0.9"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
scraper = "0.23"
secp256k1 = { version = "0.30", features = ["global-context"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
x509-parser = "0.18"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
time = "0.3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 4
