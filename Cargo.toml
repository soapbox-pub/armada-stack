[package]
name = "armada-stack"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Self-host Armada: its web app, a relay, and a Blossom server in one binary"
license = "AGPL-3.0-only"

[[bin]]
name = "armada"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arc-swap = "1"
axum = { version = "0.8", features = ["ws"] }
brotli = "8"
bytes = "1.9"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
heed = { version = "0.22", default-features = false, features = ["serde-json"] }
hex = "0.4"
http = "1"
httpdate = "1"
libc = "0.2"
lru = "0.12"
memmap2 = "0.9"
parking_lot = "0.12"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
scraper = "0.23"
secp256k1 = { version = "0.30", features = ["global-context"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 4
