[package]
name = "armada-stack"
version = "0.8.0"
edition = "2024"
rust-version = "1.92"
description = "Self-host Armada in one binary: its web app, a relay, a Blossom server, push notifications, and voice and video calls"
license = "AGPL-3.0-only"

[[bin]]
name = "armada"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
arc-swap = "1"
# Tor, built in: armada's onion service, and the way to onion relays. Pinned
# exactly, Arti and its crates together, since some of the APIs used are ones
# Arti still marks experimental and changes between releases. SQLite, which
# Arti keeps its directory in, is compiled in, so the binary stays static.
arti-client = { version = "=0.47.0", default-features = false, features = ["tokio", "rustls", "static-sqlite", "onion-service-client", "onion-service-service", "onion-service-cli-extra", "ephemeral-keystore"] }
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
brotli = "8"
bytes = "1.9"
chacha20 = "0.9"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
heed = { version = "0.22", default-features = false, features = ["serde-json"] }
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
http = "1"
httpdate = "1"
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["server-auto", "server-graceful", "service", "tokio"] }
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }
libc = "0.2"
# The LMDB heed links, used directly by the relay for duplicate-sorted
# lookups heed doesn't expose. Kept at heed's version so there's one LMDB.
lmdb-master-sys = "0.2.6"
lru = "0.12"
memmap2 = "0.9"
p256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
parking_lot = "0.12"
rand = "0.9"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
safelog = "0.10"
scraper = "0.23"
secp256k1 = { version = "0.30", features = ["global-context"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tor-cell = "=0.47.0"
tor-config = "=0.47.0"
tor-hscrypto = "=0.47.0"
tor-hsservice = "=0.47.0"
tor-keymgr = "=0.47.0"
tor-llcrypto = "=0.47.0"
tor-proto = "=0.47.0"
tor-rtcompat = "=0.47.0"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
x509-parser = "0.18"

# For build.rs, to build LiveKit in: see there.
[build-dependencies]
flate2 = "1"
sha2 = "0.10"

# Soapbox's fork of Arti, a branch per release it patches: relay selection
# compares family members as plain bytes, where upstream's constant-time
# comparison cost ~0.4 s of CPU per relay picked, and each onion service
# descriptor upload gets at least 120 seconds, where upstream gave up on slow
# HSDirs after 30 and never published to them. The branch must match the
# release arti-client is pinned to. Every Arti crate is listed: the fork's
# crates depend on each other by path, so one taken from crates.io would be a
# second copy whose types don't match.
[patch.crates-io]
arti-client              = { git = "https://git.shakespeare.diy/npub1q3sle0kvfsehgsuexttt3ugjd8xdklxfwwkh559wxckmzddywnws6cd26p/arti.git", branch = "soapbox-v2.7.0" }
caret                    = { git = "https://git.shakespeare.diy/npub1q3sle0kvfsehgsuexttt3ugjd8xdklxfwwkh559wxckmzddywnws6cd26p/arti.git", branch = "soapbox-v2.7.0" }
fs-mistrust              = { git = "https://git.shakespeare.diy/npub1q3sle0kvfsehgsuexttt3ugjd8xdklxfwwkh559wxckmzddywnws6cd26p/arti.git", branch = "soapbox-v2.7.0" }
fslock-guard             = { git = "https://git.shakespeare.diy/npub1q3sle0kvfsehgsuexttt3ugjd8xdklxfwwkh559wxckmzddywnws6cd26p/arti.git", branch = "soapbox-v2.7.0" }
oneshot-fused-workaround = { git = "https://git.shakespeare.diy/npub1q3sle0kvfsehgsuexttt3ugjd8xdklxfwwkh559wxckmzddywnws6cd26p/arti.git", branch = "soapbox-v2.7.0" }
retry-error              = { git = "https://git.shakespeare.diy/npub1q3sle0kvfsehgsuexttt3ugjd8xdklxfwwkh559wxckmzddywnws6cd26p/arti.git", branch = "soapbox-v2.7.0" }
safelog                  = { git = "https://git.shakespeare.diy/npub1q3sle0kvfsehgsuexttt3ugjd8xdklxfwwkh559wxckmzddywnws6cd26p/arti.git", branch = "soapbox-v2.7.0" }
saturating-time          = { git = "https://git.shakespeare.diy/npub1q3sle0kvfsehgsuexttt3ugjd8xdklxfwwkh559wxckmzddywnws6cd26p/arti.git", branch = "soapbox-v2.7.0" }
slotmap-careful          = { git = "https://git.shakespeare.diy/npub1q3sle0kvfsehgsuexttt3ugjd8xdklxfwwkh559wxckmzddywnws6cd26p/arti.git", branch = "soapbox-v2.7.0" }
tor-async-utils          = { git = "https://git.shakespeare.diy/npub1q3sle0kvfsehgsuexttt3ugjd8xdklxfwwkh559wxckmzddywnws6cd26p/arti.git", branch = "soapbox-v2.7.0" }
tor-basic-utils          = { git = "https://git.shakespeare.diy/npub1q3sle0kvfsehgsuexttt3ugjd8xdklxfwwkh559wxckmzddywnws6cd26p/arti.git", branch = "soapbox-v2.7.0" }
