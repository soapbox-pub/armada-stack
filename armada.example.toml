# armada configuration. Every setting is optional; these are the defaults.

# Where data is kept. Relative paths are relative to this file. Defaults to
# /var/lib/armada as root, else ~/.local/share/armada.
# storage_dir = "/var/lib/armada"

# Defaults to 127.0.0.1:8080, or [::]:443 with [tls] on.
# listen = "127.0.0.1:8080"
# Unset, it's taken from each request's Host: https:// for a public domain,
# otherwise whatever X-Forwarded-Proto says.
# public_url = "https://armada.example.com"
# Believe X-Forwarded-For. On by default when listen is loopback.
# trust_proxy = true
# Behind Cloudflare's proxy (the orange cloud): a request from one of
# Cloudflare's addresses is for the visitor CF-Connecting-IP names, and on
# port 80 is served, not redirected, if that visitor used HTTPS (Cloudflare's
# Flexible SSL). Only Cloudflare sends from its addresses, though a
# Cloudflare Worker can still name any visitor it likes.
# trust_cloudflare = true

# HTTPS with a Let's Encrypt certificate for public_url's domain. Needs DNS
# pointing here, ports 443 and 80 open, and root or CAP_NET_BIND_SERVICE.
[tls]
acme = false
# email = "ops@example.com"
# Try a new setup against https://acme-staging-v02.api.letsencrypt.org/directory.
directory = "https://acme-v02.api.letsencrypt.org/directory"
# Redirect plain HTTP to HTTPS, and answer HTTP-01 challenges.
redirect_http = true
http_listen = "[::]:80"

[web]
# The nsite to serve: an naddr, or an npub for that author's root site.
nsite = "naddr1qvzqqqyf8qpzq7q6z5ns2hm5c8msyv83qwzxpxe52j8c4d4q5m92wsp9sflelkh9qqrxzundv9jxz0nw9gl"
auto_update = true
relays = ["wss://relay.ditto.pub", "wss://relay.dreamith.to"]
resync_interval = 600
max_file_size = 104857600
max_site_size = 1073741824
# Versions kept, the served one included. A page loaded from an earlier one
# goes on finding the scripts it names, while that version is kept.
keep_versions = 60

# What the web app is told through window.ENV, at /_armada/env.js, by the
# names Armada reads. Unset, armada's own relay and Blossom server (preferred
# for uploads) join Armada's public ones as RELAYS and BLOSSOM_SERVERS, and
# its AV broker is CONCORD_AV_SERVERS alone, once public_url or a public Host
# says where armada is reached. A name set here replaces that; "" brings back Armada's
# own default, except for CONCORD_AV_SERVERS, which "" turns off.
#
# RELAYS is every relay the app uses by default: account data, search, new
# communities, and the backups of each user's community and invite lists.
# Naming relays also stops the app's helper relays (a broadcast relay, NIP-65
# indexes at login, a git index). To lean on this armada's services alone:
# [web.env]
# RELAYS = "wss://armada.example.com"
# Keep a public Blossom server besides this one, which takes only encrypted
# blobs: avatars, banners and emoji are uploaded in the clear.
# BLOSSOM_SERVERS = "https://armada.example.com/,https://blossom.ditto.pub/"
# With RELAYS on this relay alone, losing this server loses every user's list
# of communities, and search finds nothing: this relay has no NIP-50 search.

# A Nostr relay for the kinds Armada uses, within these limits.
[relay]
max_message_length = 2097152
max_subscriptions = 64
max_filters = 32
# Ids, authors, kinds and tag values, between all of one REQ's filters.
max_filter_values = 10000
max_limit = 500
max_event_tags = 2000
max_content_length = 1048576
# Seconds into the future an event's created_at may be.
created_at_upper_limit = 900
# Per connection. 0 for no limit.
events_per_minute = 600
# Per IPv4 address or IPv6 /64, across its connections. 0 for no limit.
max_connections_per_ip = 50
max_queries_per_ip = 4
max_filter_values_per_ip = 200000
events_per_minute_per_ip = 1200
reqs_per_minute_per_ip = 1200
# Bytes of events an hour, which is what bounds how fast one client can
# fill the disk: at least max_content_length.
event_bytes_per_hour_per_ip = 268435456
# Reserved address space, not disk.
map_size = 274877906944

# A Blossom server for encrypted blobs only.
[blossom]
max_blob_size = 104857600
# Per IPv4 address or IPv6 /64. 0 for no limit.
uploads_per_minute = 60
# At least max_blob_size.
upload_bytes_per_hour = 1073741824
# Bytes to leave free on the disk: uploads that would leave less are
# refused, so the relay and web app keep room to write. 0 for no floor.
min_free_space = 1073741824

# A Web Push service for the web app, speaking nostr-push2's protocol. It
# pushes events stored on this relay: NIP-17 DMs to users whose DM relay this
# is, and Concord channels here. Its key is made on first start, and the web
# app is pointed at it through NOSTR_PUSH2_PUBKEY and NOSTR_PUSH2_RELAYS
# unless [web.env] sets them.
[push]
enabled = true
# Who push services may contact: mailto: or https://. Defaults to
# public_url, or else https://armada.buzz.
# subject = "mailto:ops@example.com"

# Tor, built in: no tor daemon to install. With it, relays at .onion
# addresses can be reached, such as the ones an nsite's author publishes to.
[tor]
enabled = true
# Serve armada as an onion service too: the web app, relay and Blossom
# server, over Tor. The address is made on first start and printed by
# `armada onion`; its key is tor/hs_ed25519_secret_key in storage_dir, in
# C Tor's format, so back it up to keep the address.
onion_service = true

# Voice and video calls: a blind Concord AV broker (CORD-07 §2), placing
# calls on LiveKit. Needs public_url, and 7881/tcp and 7882/udp open.
[av]
# Run the LiveKit built into armada, with deploy/livekit.yaml, as the node on
# armada's own origin. Its key and secret are made on first start, in
# livekit/ in storage_dir. A node in [[av.nodes]] on armada's own origin
# takes its place.
livekit = true
# The public address clients send the built-in LiveKit's media to: an IPv4
# address, an IPv6 one, or both as "v4,v6". Unset, it's the public addresses
# on this machine's own interfaces, or, on a machine with none, behind a NAT
# as on AWS or GCP, whatever STUN finds; LiveKit won't start if no STUN
# server can be reached. Set it there to the public or elastic IP.
# node_ip = "203.0.113.7"
# Seconds a token lasts. At most 86400.
token_ttl = 21600
max_skew = 60
# At least 240, and at least twice max_skew.
replay_ttl = 240
rate_limit_per_minute = 60
health_interval = 15

# LiveKit servers you run, besides or instead of the built-in one; list
# several to share calls between them.
# [[av.nodes]]
# A bare wss:// origin. If it's armada's own, armada forwards /rtc to api_url.
# url = "wss://armada.example.com"
# For health checks, and forwarding. Defaults to url as https://.
# api_url = "http://127.0.0.1:7880"
# From `docker run --rm livekit/livekit-server generate-keys`.
# api_key = "APIxxxxxxxxxxxx"
# api_secret = "..."
