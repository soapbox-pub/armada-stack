# armada configuration. Every setting is optional; these are the defaults.
#
# Read from the file passed with --config, or else the first that exists of:
#   $XDG_CONFIG_HOME/armada/armada.toml  (~/.config/armada/armada.toml)
#   /etc/armada/armada.toml

# Where every service keeps its data: web/, relay/ and blossom/ each hold an
# LMDB database, blobs/ the site's files, and blossom/blobs/ the Blossom
# server's uploads. A relative path is relative
# to this file's directory. Defaults to /var/lib/armada when run as root, and
# to $XDG_DATA_HOME/armada (~/.local/share/armada) for anyone else.
# storage_dir = "/var/lib/armada"

# Where everything is served from, on one origin: the web app at its own
# paths, the relay at / (WebSocket upgrades and NIP-11 requests), and the
# Blossom server at /upload, /mirror and /<sha256>. Use
# https://armada.example.com/ as both the relay (wss://) and the Blossom
# server. Either point a reverse proxy at it, or turn on [tls] below to
# serve HTTPS directly. Defaults to 127.0.0.1:8080, or to [::]:443 with
# [tls] on.
# listen = "127.0.0.1:8080"
# The origin clients reach armada at. Blossom blob URLs are built on it, and
# Blossom tokens scoped with `server` tags must name its domain. Unset, it's
# taken from each request's Host and X-Forwarded-Proto headers.
# public_url = "https://armada.example.com"
# Whether a reverse proxy sits in front, so a client's address is the last
# X-Forwarded-For entry, the one the proxy added. On by default when listen
# is a loopback address, since only something on this box can reach it then.
# trust_proxy = true

# HTTPS without a reverse proxy: armada gets a certificate for public_url's
# domain from Let's Encrypt, renews it, and serves on listen ([::]:443 by
# default). The domain's DNS has to point at this box, and ports 443 and 80
# be reachable from the internet. Ports below 1024 need root, or
# CAP_NET_BIND_SERVICE (AmbientCapabilities=CAP_NET_BIND_SERVICE under
# systemd). The certificate and ACME account are kept in storage_dir/tls/.
[tls]
# Needs public_url, as https:// on the default port.
acme = false
# An address Let's Encrypt may write to about the certificate.
# email = "ops@example.com"
# The ACME directory. Let's Encrypt's staging one,
# https://acme-staging-v02.api.letsencrypt.org/directory, issues untrusted
# certificates but has far looser rate limits: try a new setup against it.
directory = "https://acme-v02.api.letsencrypt.org/directory"
# Also listen on http_listen, redirecting to HTTPS and answering the CA's
# HTTP-01 challenges if its TLS-ALPN-01 ones, on listen, don't get through.
redirect_http = true
http_listen = "[::]:80"

[web]
# The nsite to serve: an naddr, or an npub for that author's root site.
# The default is Armada's official site, published by Team Soapbox.
nsite = "naddr1qvzqqqyf8qpzq7q6z5ns2hm5c8msyv83qwzxpxe52j8c4d4q5m92wsp9sflelkh9qqrxzundv9jxz0nw9gl"
# Follow new versions as they're published. Off, the first version
# downloaded is served for good.
auto_update = true
# Relays to look for the site on, alongside its author's own.
relays = ["wss://relay.ditto.pub", "wss://relay.dreamith.to"]
# Blossom servers to try after the ones the site and its author name.
blossom_servers = ["https://blossom.ditto.pub/", "https://blossom.dreamith.to/", "https://blossom.primal.net/"]
# Seconds between full checks for a new version.
resync_interval = 600
# Bytes one file, and one version of the site, may be.
max_file_size = 104857600
max_site_size = 1073741824

# A Nostr relay (NIP-01, 09, 11, 40) anyone may read from and publish to,
# within these limits. They're advertised in its NIP-11 document.
[relay]
# Bytes one message from a client may be.
max_message_length = 131072
# Subscriptions one connection may have open, and filters one REQ may have.
max_subscriptions = 32
max_filters = 16
# The most events one filter returns, and how many it returns by default.
max_limit = 500
# Tags one event may have, and bytes its content may be.
max_event_tags = 2000
max_content_length = 65536
# Seconds into the future an event's created_at may be.
created_at_upper_limit = 900
# Events one connection may publish a minute. 0 for no limit.
events_per_minute = 600
# The most the database may grow to, in bytes. Reserved address space, not
# disk: the file only grows as events arrive.
map_size = 274877906944

# A Blossom server that only accepts encrypted blobs, and only ever serves
# them back as application/octet-stream. Anyone with a valid upload token
# may upload.
[blossom]
# Bytes one blob may be.
max_blob_size = 104857600

# A blind Concord AV broker (CORD-07 §2): it hands out seats in voice and
# video calls on LiveKit servers you run, at /.well-known/concord/av. Off
# until a node is listed below; needs public_url, since clients sign their
# requests over it. It never learns who is calling or which Community a call
# belongs to, and the media it carries is end-to-end encrypted.
#
# Being blind, it's open to anyone: it's bounded by the rate limit here,
# short-lived tokens, and LiveKit's room.max_participants. See
# deploy/livekit.yaml for a LiveKit config to start from.
[av]
# Seconds a token lasts. Clients keep one for a whole call. At most 86400.
token_ttl = 21600
# Seconds a request's signature may be from now, either way.
max_skew = 60
# Seconds a request's id is remembered to refuse it a second time. At least
# 240, and at least twice max_skew.
replay_ttl = 240
# Token requests one client may make a minute, by IPv4 address or IPv6 /64.
rate_limit_per_minute = 60
# Seconds between health checks of each node.
health_interval = 15

# One LiveKit server. List several to share calls between them: each call
# goes to one, picked from its room's name, so they need nothing shared.
# [[av.nodes]]
# What clients connect to: a bare wss:// origin, never ending in /rtc, which
# the LiveKit SDK adds itself. Make it armada's own origin, like
# wss://armada.example.com, and armada forwards /rtc and /rtc/* to the node
# at api_url, so it needs no domain or certificate of its own. One node can
# be on armada's origin; others need domains of their own.
# url = "wss://armada.example.com"
# Where armada reaches its server API for health checks, and forwards
# signaling to for a node on its own origin, which has to set it. Defaults
# to url with https:// for wss://.
# api_url = "http://127.0.0.1:7880"
# Its credentials, from `docker run --rm livekit/livekit-server generate-keys`.
# api_key = "APIxxxxxxxxxxxx"
# api_secret = "..."
