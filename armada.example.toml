# armada configuration. Every setting is optional; these are the defaults.

# Where data is kept. Relative paths are relative to this file. Defaults to
# /var/lib/armada as root, else ~/.local/share/armada.
# storage_dir = "/var/lib/armada"

# Defaults to 127.0.0.1:8080, or [::]:443 with [tls] on.
# listen = "127.0.0.1:8080"
# Unset, it's taken from each request's Host: https:// for a public domain,
# otherwise whatever X-Forwarded-Proto says.
# public_url = "https://armada.example.com"
# Believe X-Forwarded-For. On by default when listen is loopback.
# trust_proxy = true

# HTTPS with a Let's Encrypt certificate for public_url's domain. Needs DNS
# pointing here, ports 443 and 80 open, and root or CAP_NET_BIND_SERVICE.
[tls]
acme = false
# email = "ops@example.com"
# Try a new setup against https://acme-staging-v02.api.letsencrypt.org/directory.
directory = "https://acme-v02.api.letsencrypt.org/directory"
# Redirect plain HTTP to HTTPS, and answer HTTP-01 challenges.
redirect_http = true
http_listen = "[::]:80"

[web]
# The nsite to serve: an naddr, or an npub for that author's root site.
nsite = "naddr1qvzqqqyf8qpzq7q6z5ns2hm5c8msyv83qwzxpxe52j8c4d4q5m92wsp9sflelkh9qqrxzundv9jxz0nw9gl"
auto_update = true
relays = ["wss://relay.ditto.pub", "wss://relay.dreamith.to"]
resync_interval = 600
max_file_size = 104857600
max_site_size = 1073741824
# Versions kept, the served one included. A page loaded from an earlier one
# goes on finding the scripts it names, while that version is kept.
keep_versions = 60

# What the web app is told through window.ENV, at /_armada/env.js, by the
# names Armada reads. Unset, armada's own relay (also a home for new
# communities), Blossom server (preferred for uploads) and AV broker join
# Armada's public ones, once public_url or a public Host says where armada is
# reached. A name set here replaces that. "" turns off CONCORD_AV_SERVERS,
# BROADCAST_RELAYS and PREFERRED_BLOSSOM_SERVER, but brings back Armada's own
# default for APP_RELAYS, COMMUNITY_RELAYS, APP_BLOSSOM_SERVERS and
# SEARCH_RELAYS. To lean on this armada's services alone:
# [web.env]
# APP_RELAYS = "wss://armada.example.com"
# COMMUNITY_RELAYS = "wss://armada.example.com"
# CONCORD_AV_SERVERS = "https://armada.example.com"
# Keep a public Blossom server besides this one, which takes only encrypted
# blobs: avatars, banners and emoji are uploaded in the clear.
# APP_BLOSSOM_SERVERS = "https://armada.example.com/,https://blossom.ditto.pub/"

# A Nostr relay for the kinds Armada uses, within these limits.
[relay]
max_message_length = 2097152
max_subscriptions = 32
max_filters = 100
max_limit = 500
max_event_tags = 2000
max_content_length = 1048576
# Seconds into the future an event's created_at may be.
created_at_upper_limit = 900
# Per connection. 0 for no limit.
events_per_minute = 600
# Per IPv4 address or IPv6 /64, across its connections. 0 for no limit.
max_connections_per_ip = 50
max_queries_per_ip = 4
events_per_minute_per_ip = 1200
# Reserved address space, not disk.
map_size = 274877906944

# A Blossom server for encrypted blobs only.
[blossom]
max_blob_size = 104857600
# Per IPv4 address or IPv6 /64. 0 for no limit.
uploads_per_minute = 60
# At least max_blob_size.
upload_bytes_per_hour = 1073741824

# A Web Push service for the web app, speaking nostr-push2's protocol. It
# pushes events stored on this relay: NIP-17 DMs to users whose DM relay this
# is, and Concord channels here. Its key is made on first start, and the web
# app is pointed at it through NOSTR_PUSH2_PUBKEY and NOSTR_PUSH2_RELAYS
# unless [web.env] sets them.
[push]
enabled = true
# Who push services may contact: mailto: or https://. Defaults to
# public_url, or else https://armada.buzz.
# subject = "mailto:ops@example.com"

# A blind Concord AV broker (CORD-07 §2) for LiveKit servers you run. Off
# until a node is listed; needs public_url. See deploy/livekit.yaml.
[av]
# Seconds a token lasts. At most 86400.
token_ttl = 21600
max_skew = 60
# At least 240, and at least twice max_skew.
replay_ttl = 240
rate_limit_per_minute = 60
health_interval = 15

# One LiveKit server; list several to share calls between them.
# [[av.nodes]]
# A bare wss:// origin. If it's armada's own, armada forwards /rtc to api_url.
# url = "wss://armada.example.com"
# For health checks, and forwarding. Defaults to url as https://.
# api_url = "http://127.0.0.1:7880"
# From `docker run --rm livekit/livekit-server generate-keys`.
# api_key = "APIxxxxxxxxxxxx"
# api_secret = "..."
