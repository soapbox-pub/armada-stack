# The .deb and .rpm each release publishes, built by build.sh, which sets the
# variables below and runs nfpm in a directory holding every file named here.
# They install what install.sh does, in the places a package belongs: the
# binary in /usr/bin rather than /usr/local/bin, and the unit with the
# distribution's.

# The project's name, which the binary, user and service aren't named after.
name: armada-stack
version: ${ARMADA_VERSION}
arch: ${ARMADA_ARCH}
platform: linux
section: net
priority: optional
maintainer: Soapbox <contact@soapbox.pub>
description: Self-host Armada in one binary
homepage: https://gitworkshop.dev/soapbox.pub/armada-stack
license: AGPL-3.0-only

# The binary is static; systemd is for the unit, and for the scripts, which
# create the user and set the UDP buffers with systemd-sysusers and
# systemd-sysctl.
depends:
  - systemd

contents:
  - src: armada
    dst: /usr/bin/armada
    file_info:
      mode: 0755
  - src: armada.service
    dst: /usr/lib/systemd/system/armada.service
    file_info:
      mode: 0644
  - src: sysusers.conf
    dst: /usr/lib/sysusers.d/armada.conf
    file_info:
      mode: 0644
  - src: sysctl.conf
    dst: /usr/lib/sysctl.d/60-armada.conf
    file_info:
      mode: 0644
  # Never replaced on upgrade once installed; dpkg removes it on purge.
  # postinstall gives it to the armada group, which doesn't exist yet here.
  - src: armada.toml
    dst: /etc/armada/armada.toml
    type: config|noreplace
    file_info:
      mode: 0640
  - src: LICENSE
    dst: /usr/share/doc/armada-stack/copyright
    packager: deb
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/licenses/armada-stack/LICENSE
    packager: rpm
    file_info:
      mode: 0644

scripts:
  postinstall: postinstall.sh
  preremove: preremove.sh
  postremove: postremove.sh
