#cloud-config
# Armada 1-Click droplet — DigitalOcean user-data (cloud-init).
#
# Paste this whole file into the "User data" field when creating a droplet
# (Create Droplet -> Advanced options -> Add Initialization scripts). On a fresh
# Ubuntu 24.04 droplet it opens the firewall, sets the two host sysctls the
# stack needs, clones the stack, and runs its firstboot.sh — which installs
# Docker and brings the whole thing up in PULL MODE: relay/broker/push are
# pulled from ncontainer.io and the client is built from a git-URL context.
# NOTHING is fetched to a `../` sibling path — the deploy is reproducible from
# URLs alone.
#
# ─────────────────────────────────────────────────────────────────────────────
# YOU EDIT TWO LINES — DOMAIN and EMAIL, in the deploy.env block just below —
# and set STACK_REPO to the stack's published clone URL (see the README; the
# stack has to be published somewhere before a droplet can clone it).
# ─────────────────────────────────────────────────────────────────────────────
# Everything else has a working default. After the droplet boots you still have
# to point four DNS records at its IP (armada. av. relay. blossom.) — Caddy
# cannot issue TLS certificates until they resolve here, so the stack comes up
# but serves nothing until you do. See deploy/digitalocean/README.md.
#
# The boot logic itself is NOT duplicated here — it lives in the stack's
# deploy/digitalocean/firstboot.sh, which this file clones and runs. The same
# script is what the Packer image (Path B) runs, so there is one boot sequence,
# not two that drift.

write_files:
  # The values that make this droplet yours. Read by firstboot.sh (which looks
  # here by default). The stack writes nothing secret into the image; every
  # secret is generated on first boot by bootstrap.sh.
  - path: /etc/armada/deploy.env
    permissions: '0600'
    content: |
      # EDIT THESE. DOMAIN yields armada.<d> av.<d> relay.<d> blossom.<d>.
      DOMAIN=example.com
      EMAIL=you@example.com

      # Where cloud-init clones the stack glue from. No default: the stack has
      # to be published to a git host first (https:// or nostr://). If it is a
      # nostr:// URL, cloud-init installs ngit to clone it. See the README.
      STACK_REPO=

      # Optional: pin the client source. Default is the public mirror's default
      # branch; append #<tag|branch|sha> for a reproducible build, e.g.
      #   ARMADA_BUILD_CONTEXT=https://github.com/soapbox-pub/armada.git#v1.4.2
      # firstboot.sh exports it so docker-compose.pull.yml's default is overridden.
      #ARMADA_BUILD_CONTEXT=

  # Host sysctls the stack cannot set from inside a container (they belong to
  # the host kernel). OpenSearch refuses to start below max_map_count=262144;
  # LiveKit drops inbound media under load below rmem_max=5MB. Persisted here so
  # they survive a reboot; firstboot.sh also applies them live before the first
  # `up`.
  - path: /etc/sysctl.d/99-armada.conf
    content: |
      vm.max_map_count=262144
      net.core.rmem_max=5000000

runcmd:
  # Apply the sysctls now (write_files only persisted them for reboots).
  - sysctl --system

  # On-host firewall. DO also offers a separate Cloud Firewall in the panel;
  # this makes the droplet correct on its own. 7882/udp is the voice media path
  # — with it closed voice connects and then carries no audio. 443/udp is
  # HTTP/3. 22 keeps you able to SSH in.
  - |
    if command -v ufw >/dev/null 2>&1; then
      ufw allow 22/tcp
      ufw allow 80/tcp
      ufw allow 443/tcp
      ufw allow 443/udp
      ufw allow 7881/tcp
      ufw allow 7882/udp
      ufw --force enable
    fi

  # Clone the stack and hand off to its firstboot.sh. Everything after this —
  # Docker, bootstrap, up — is that one script, shared with the Packer image.
  - |
    set -eu
    . /etc/armada/deploy.env
    if [ -z "${STACK_REPO:-}" ]; then
      echo "deploy.env: STACK_REPO is empty. Publish the stack and set it (see" \
           "deploy/digitalocean/README.md), then re-run: bash /opt/armada/stack/deploy/digitalocean/firstboot.sh" \
           | tee /var/log/armada-firstboot.log
      exit 0
    fi
    command -v git >/dev/null 2>&1 || { apt-get update -y && apt-get install -y git; }
    case "$STACK_REPO" in
      nostr://*) command -v ngit >/dev/null 2>&1 || curl -Ls https://ngit.dev/install.sh | bash ;;
    esac
    mkdir -p /opt/armada
    [ -d /opt/armada/stack/.git ] || git clone "$STACK_REPO" /opt/armada/stack
    exec bash /opt/armada/stack/deploy/digitalocean/firstboot.sh
