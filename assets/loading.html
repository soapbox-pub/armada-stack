<!doctype html>
<!--
  armada's page while the web app is still downloading: src/web/loading.rs
  serves it, and loading.js polls /_armada/status.json and reloads into the
  app once it's live. The crest is the app's (index.html's boot splash), and
  the colors its dark "Corsair" theme, which the app shows by default.
-->
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100b15">
<meta name="color-scheme" content="dark">
<title>Armada</title>
<link rel="icon" href="/_armada/icon.png">
<noscript><meta http-equiv="refresh" content="30"></noscript>
<style>
  :root {
    --background: 260 22% 9%;
    --foreground: 42 38% 90%;
    --primary: 330 90% 62%;
    --accent2: 180 90% 55%;
    --muted: 260 22% 17%;
    --muted-foreground: 42 26.6% 60%;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: hsl(var(--background));
    color: hsl(var(--foreground));
    font-family: system-ui, sans-serif;
    overflow: hidden;
  }
  main {
    position: relative;
    z-index: 1;
    min-height: 100svh;
    max-width: 36rem;
    margin: 0 auto;
    padding: 4rem 1.5rem 22svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
    text-align: center;
  }
  .brand { display: flex; flex-direction: column; align-items: center; gap: 2rem; }
  .crest { filter: drop-shadow(0 8px 24px hsl(var(--primary) / 0.25)); }
  .mark { display: flex; flex-direction: column; align-items: center; gap: 0.375rem; font-family: var(--mono); }
  .wordmark { font-size: 3rem; line-height: 1; font-weight: 700; letter-spacing: -0.025em; }
  @media (min-width: 640px) { .wordmark { font-size: 3.75rem; } }
  .status { min-height: 1.75rem; font-size: 1.125rem; line-height: 1.75rem; color: hsl(var(--primary)); }
  @media (max-width: 420px) { .status { font-size: 1rem; } }
  .prompt { color: hsl(var(--accent2)); }
  .caret { animation: armada-caret 1s step-end infinite; }
  .progress { width: 100%; max-width: 24rem; display: flex; flex-direction: column; gap: 0.75rem; }
  .bar {
    --cut: 0.45rem;
    height: 0.75rem;
    background: hsl(var(--muted));
    clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
    overflow: hidden;
    visibility: hidden;
  }
  .bar.shown { visibility: visible; }
  .fill {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, hsl(var(--primary)), hsl(var(--accent2)));
    transition: width 0.4s ease-out;
  }
  .note { margin: 0; font-size: 0.875rem; line-height: 1.5; color: hsl(var(--muted-foreground)); }
  .sea {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    user-select: none;
    overflow: hidden;
    font-family: var(--mono);
    font-size: 0.8125rem;
    line-height: 1;
    white-space: pre;
    contain: layout paint;
    -webkit-mask-image: linear-gradient(to bottom, transparent 66%, black 86%);
    mask-image: linear-gradient(to bottom, transparent 66%, black 86%);
  }
  /* A short screen has the text further down it: keep the sea below. */
  @media (max-height: 720px) {
    .sea {
      -webkit-mask-image: linear-gradient(to bottom, transparent 76%, black 94%);
      mask-image: linear-gradient(to bottom, transparent 76%, black 94%);
    }
    main { padding-bottom: 14svh; }
  }
  @keyframes armada-trace { 0% { opacity: 1; stroke-dashoffset: 1; } 76% { opacity: 1; stroke-dashoffset: 0; } 100% { opacity: 0; stroke-dashoffset: 0; } }
  @keyframes armada-ink { from { opacity: 0; } to { opacity: 1; } }
  @keyframes armada-sheen { 0%, 100% { opacity: 0; } 45% { opacity: 1; } }
  @keyframes armada-sweep { from { opacity: 0; transform: scaleX(0.15); } to { opacity: 1; transform: scaleX(1); } }
  @keyframes armada-wake { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(0.78); } }
  @keyframes armada-caret { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    [style*="animation"], .caret { animation: none !important; }
    .fill { transition: none; }
  }
</style>
</head>
<body>
<div class="sea" id="sea" aria-hidden="true"></div>
<main>
  <div class="brand">
    <svg class="crest" width="150" height="150" viewBox="0 0 128 128" fill="none" role="img" aria-label="Armada logo">
      <g fill="hsl(var(--accent2))">
        <g style="transform-origin:64px 0;animation:armada-wake 6s ease-in-out 0.9s infinite;">
          <path d="M95.4 104.865H32.59c-1.18 0-2.14-.96-2.14-2.14s.96-2.14 2.14-2.14H95.4c1.18 0 2.14.96 2.14 2.14s-.96 2.14-2.14 2.14z" style="transform-origin:64px 0;animation:armada-sweep 0.52s cubic-bezier(0.22,1,0.36,1) both;"></path>
        </g>
        <g style="transform-origin:64px 0;animation:armada-wake 6s ease-in-out 1.5s infinite;">
          <path d="M83.98 115.565H44.01a1.43 1.43 0 1 1 0-2.86h39.97a1.43 1.43 0 1 1 0 2.86z" style="transform-origin:64px 0;animation:armada-sweep 0.52s cubic-bezier(0.22,1,0.36,1) 0.07s both;"></path>
        </g>
        <g style="transform-origin:64px 0;animation:armada-wake 6s ease-in-out 2.1s infinite;">
          <path d="M73.99 123.775H54.01a1.071 1.071 0 0 1 0-2.14h19.98a1.071 1.071 0 0 1 0 2.14z" style="transform-origin:64px 0;animation:armada-sweep 0.52s cubic-bezier(0.22,1,0.36,1) 0.14s both;"></path>
        </g>
      </g>
      <path d="M64 4.225l-39.97 88.5h17.13l2.31-5.2 2.76-6.22-2.22-1.43-1.42-12.84h9.99l4.89-11.01L64 41.335l11.42 25.7h9.99l-1.43 12.84-2.22 1.43 2.77 6.22 2.31 5.2h17.13z" fill="hsl(var(--primary))" style="opacity:0;filter:drop-shadow(0 0 10px hsl(var(--primary) / 0.6));animation:armada-sheen 0.9s ease-in-out 0.64s both;"></path>
      <path d="M64 4.225l-39.97 88.5h17.13l2.31-5.2 2.76-6.22-2.22-1.43-1.42-12.84h9.99l4.89-11.01L64 41.335l11.42 25.7h9.99l-1.43 12.84-2.22 1.43 2.77 6.22 2.31 5.2h17.13z" fill="hsl(var(--primary))" style="animation:armada-ink 0.42s ease-out 0.4s both;"></path>
      <path d="M64 4.225l-39.97 88.5h17.13l2.31-5.2 2.76-6.22-2.22-1.43-1.42-12.84h9.99l4.89-11.01L64 41.335l11.42 25.7h9.99l-1.43 12.84-2.22 1.43 2.77 6.22 2.31 5.2h17.13z" pathLength="1" fill="none" stroke="hsl(var(--primary))" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:0;stroke-dasharray:1;animation:armada-trace 0.78s cubic-bezier(0.65,0,0.35,1) 0.08s both;"></path>
      <path d="M76.84 79.165c-.15 0-.31-.05-.44-.15l-12.41-9.65-12.41 9.65c-.31.24-.76.19-1-.13a.706.706 0 0 1 .13-1l12.85-9.99c.26-.2.62-.2.88 0l12.85 9.99a.715.715 0 0 1-.43 1.28z" fill="hsl(var(--primary))" fill-opacity="0.85" style="animation:armada-ink 0.32s ease-out 0.86s both;"></path>
    </svg>
    <div class="mark">
      <span class="wordmark">armada</span>
      <span class="status" role="status" aria-live="polite"><span class="prompt">$ </span><span id="status">getting armada ready</span><span class="caret">_</span></span>
    </div>
  </div>
  <div class="progress">
    <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
    <p class="note">This server is downloading the Armada web app from Nostr. This page opens it as soon as it's ready.</p>
  </div>
</main>
<script src="/_armada/loading.js"></script>
</body>
</html>
