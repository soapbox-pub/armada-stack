name: Release

# On a version tag (vX.Y.Z): test, build static Linux binaries for x86_64 and
# aarch64 with LiveKit built in, and publish them as an ngit release (NIP-82)
# signed by the Soapbox key, as .ngit/release.yaml describes. The binaries
# are also uploaded as run artifacts first, so a failed publish still leaves
# them on the CI result.
#
# Secrets, provisioned on the coordinator under its #SOAPBOX alias, which
# covers every repository of the Soapbox key:
#   NSYTE_BUNKER  an nbunksec for a remote signer session on the Soapbox key
#                 (npub10qdp2…), which owns the application. The same session
#                 publishes Armada's nsite, hence the name. Releases signed by
#                 any other key are refused by `pubkey` in the manifest.

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Pinned with their checksums: these run with the release signer in the
      # environment.
      ZIG_VERSION: 0.16.0
      ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
      ZIGBUILD_VERSION: 0.23.4
      ZIGBUILD_SHA256: 9e3cf73485edbd45905c8aadbc0fdf869c7ddc3848f0c898229f2680db52e44b
      # The LiveKit built into armada (src/av/builtin.rs): its release
      # tarballs, from the release's checksums.txt.
      LIVEKIT_VERSION: 1.13.7
      LIVEKIT_AMD64_SHA256: 6634aeeb2fb1366b6723708ae4320b9d5408106a4c63457c5e845ae3979c90e2
      LIVEKIT_ARM64_SHA256: 5d167fdf52cf43c0c72972f25325364479f41f854bfef651056eab2504da5de9
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml
        id: version
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          if [ "$version" != "$cargo_version" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match Cargo.toml's version $cargo_version." >&2
            exit 1
          fi
          grep -qE "^## \[?v?$version\]?( |$)" CHANGELOG.md || {
            echo "CHANGELOG.md has no section for $version." >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust, zig and cargo-zigbuild
        run: |
          set -eu
          if ! command -v rustup >/dev/null; then
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl

          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          cd "$tools"
          curl -fsSL -o zig.tar.xz "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
          echo "$ZIG_SHA256  zig.tar.xz" | sha256sum -c -
          tar -xJf zig.tar.xz
          curl -fsSL -o zigbuild.tar.xz "https://github.com/rust-cross/cargo-zigbuild/releases/download/v$ZIGBUILD_VERSION/cargo-zigbuild-x86_64-unknown-linux-musl.tar.xz"
          echo "$ZIGBUILD_SHA256  zigbuild.tar.xz" | sha256sum -c -
          tar -xJf zigbuild.tar.xz
          echo "$tools/zig-x86_64-linux-$ZIG_VERSION" >> "$GITHUB_PATH"
          echo "$tools/cargo-zigbuild-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"

      - name: Download LiveKit
        run: |
          set -eu
          dir="$RUNNER_TEMP/livekit"
          for arch in amd64 arm64; do
            mkdir -p "$dir/$arch"
            curl -fsSL -o "$dir/$arch.tar.gz" "https://github.com/livekit/livekit/releases/download/v$LIVEKIT_VERSION/livekit_${LIVEKIT_VERSION}_linux_$arch.tar.gz"
            case "$arch" in
              amd64) sha="$LIVEKIT_AMD64_SHA256" ;;
              arm64) sha="$LIVEKIT_ARM64_SHA256" ;;
            esac
            echo "$sha  $dir/$arch.tar.gz" | sha256sum -c -
            tar -xzf "$dir/$arch.tar.gz" -C "$dir/$arch" livekit-server
          done

      - name: Test
        run: cargo test --locked

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          # zig's linker holds every object file open at once, and there are
          # over a thousand since Arti: more than the default soft limit.
          ulimit -n "$(ulimit -Hn)"
          echo "open files: $(ulimit -n)"
          zig version
          cargo-zigbuild --version
          mkdir -p dist
          export ARMADA_LIVEKIT_VERSION="$LIVEKIT_VERSION"
          for arch in x86_64 aarch64; do
            case "$arch" in
              x86_64) export ARMADA_LIVEKIT="$RUNNER_TEMP/livekit/amd64/livekit-server" ;;
              aarch64) export ARMADA_LIVEKIT="$RUNNER_TEMP/livekit/arm64/livekit-server" ;;
            esac
            cargo zigbuild --release --locked --target "$arch-unknown-linux-musl"
            cp "${CARGO_TARGET_DIR:-target}/$arch-unknown-linux-musl/release/armada" "dist/armada-$VERSION-linux-$arch"
          done
          # The x86_64 build has to run here, and run anywhere: no dynamic
          # loader, no libc.
          ./dist/armada-$VERSION-linux-x86_64 --version
          file dist/* || true
          (cd dist && sha256sum armada-* > SHA256SUMS)
          cat dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: armada-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

      - uses: danconwaydev/setup-ngit@v3

      - name: Publish the release
        env:
          NSYTE_BUNKER: ${{ secrets.NSYTE_BUNKER }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          : "${NSYTE_BUNKER:?NSYTE_BUNKER is not set; ask the ngit-ci operator to provision it for #SOAPBOX.}"
          umask 077
          printf '%s' "$NSYTE_BUNKER" > "$RUNNER_TEMP/nbunksec"
          # The checkout's remote is the coordinator's clone, so name the
          # repository. The checkout has the tagged commit but not the tag
          # itself, so the version and commit are given rather than found.
          ngit release publish "$VERSION" --defaults \
            --repo nostr://npub10qdp2fc9ta6vraczxrcs8prqnv69fru2k6s2dj48gqjcylulmtjsg9arpj/git.shakespeare.diy/armada-stack \
            --commit "$GITHUB_SHA" \
            --nbunksec-file "$RUNNER_TEMP/nbunksec"

      - name: Remove the signer
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/nbunksec"
